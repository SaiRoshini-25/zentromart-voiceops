<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZentroMart VoiceOps</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><span>ZENTROMART</span><h1>Support, with a human touch.</h1><p>AI-powered policy and order support</p></header>
<section id="chat" aria-live="polite"><div class="bot">Hello! I'm ZentroMart's AI assistant. How can I help?</div></section>
<form id="form"><input id="message" placeholder="Ask about an order, refund, or return" autocomplete="off"><button>Send</button></form>
<div class="voice"><button id="record" type="button">Start voice message</button><input id="audio-file" type="file" accept="audio/*" aria-label="Upload an audio message"><label>Listen <select id="stt-language" aria-label="Speech recognition language"><option value="en-IN">English / Hinglish (Latin script)</option><option value="bn-IN">Bengali</option><option value="gu-IN">Gujarati</option><option value="hi-IN">Hindi</option><option value="kn-IN">Kannada</option><option value="ml-IN">Malayalam</option><option value="mr-IN">Marathi</option><option value="pa-IN">Punjabi</option><option value="ta-IN">Tamil</option><option value="te-IN">Telugu</option></select></label><label>Reply <select id="tts-language" aria-label="Speech output language"><option value="en-IN">English</option><option value="hi-en">Hinglish</option><option value="bn-IN">Bengali</option><option value="gu-IN">Gujarati</option><option value="hi-IN">Hindi</option><option value="kn-IN">Kannada</option><option value="ml-IN">Malayalam</option><option value="mr-IN">Marathi</option><option value="pa-IN">Punjabi</option><option value="ta-IN">Tamil</option><option value="te-IN">Telugu</option></select></label><label>Voice <select id="tts-voice" aria-label="Gnani speech voice"><option value="Kaveri">Kaveri</option><option value="Trupti">Trupti</option><option value="Pranav">Pranav</option><option value="Shlok">Shlok</option></select></label></div>
<button id="reset" class="link">Start new conversation</button></main><script src="/static/app.js"></script></body></html>
